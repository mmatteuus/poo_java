name: MTS AutoFix Pilot - Java CI
on:
  push:
    branches: [master, 'mts-autofix/**']
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile standalone Java exercises
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/classes
          javac -encoding UTF-8 -d build/classes Exercicios_POO_em_Java/AD1_POO_2022_1.java Exercicios_POO_em_Java/APx2_2022_1_Q1.java
      - name: Verify entry points
        shell: bash
        run: |
          set -euo pipefail
          test -f build/classes/AD1_POO_2022_1.class
          test -f build/classes/APx2_2022_1_Q1.class
